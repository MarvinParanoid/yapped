# Pinned rather than derived from the directory name: the database and the
# uploads live in volumes prefixed with this, so a renamed or relocated
# checkout would otherwise come up pointing at empty ones.
name: yapped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # This box is shared with other services and has under 1 GB of RAM.
    deploy:
      resources:
        limits:
          memory: 256M
    shm_size: 128mb
    environment:
      POSTGRES_USER: yapped
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yapped}
      POSTGRES_DB: yapped
    volumes:
      - yapped-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapped -d yapped"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations (and optionally the demo archive) before the
  # app starts, and the only place `npm run bootstrap` / `grant:admin` can run —
  # the runtime image is a Next standalone build and carries neither tsx nor the
  # Prisma CLI.
  #
  # `image` and `build` together on purpose: a deploy pulls the tag that CI
  # published, while `docker compose build` still works on a laptop with no
  # registry involved.
  migrate:
    image: ${YAPPED_TOOLS_IMAGE:-ghcr.io/marvinparanoid/yapped-tools}:${YAPPED_TAG:-latest}
    build:
      context: .
      target: tools
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://yapped:${POSTGRES_PASSWORD:-yapped}@db:5432/yapped?schema=public
      STORAGE_LOCAL_DIR: /app/var/uploads
      SEED_MODE: ${SEED_MODE:-base}
    volumes:
      - yapped-uploads:/app/var/uploads
    command: >-
      sh -c "npx prisma migrate deploy &&
             if [ \"$$SEED_MODE\" = demo ]; then npx prisma db seed; fi"

  app:
    image: ${YAPPED_IMAGE:-ghcr.io/marvinparanoid/yapped}:${YAPPED_TAG:-latest}
    build:
      context: .
      target: runner
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://yapped:${POSTGRES_PASSWORD:-yapped}@db:5432/yapped?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/var/uploads
      # Empty by default — a real instance starts with no records at all.
      # Set SEED_MODE=demo to boot with the fictional demo archive instead.
      SEED_MODE: ${SEED_MODE:-base}
    ports:
      # Bound to loopback: the reverse proxy is the only way in.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - yapped-uploads:/app/var/uploads
    # /login is the one page an outsider may fetch, and it reads the database
    # to decide whether to show the demo hint — so a pass proves both halves.
    # `node -e` rather than curl: the runtime image carries neither curl nor wget.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  yapped-db:
  yapped-uploads:
