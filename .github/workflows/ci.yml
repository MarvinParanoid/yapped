name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yapped
          POSTGRES_PASSWORD: yapped
          POSTGRES_DB: yapped_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yapped"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://yapped:yapped@localhost:5432/yapped_test?schema=public
      DATABASE_URL: postgresql://yapped:yapped@localhost:5432/yapped_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Service tests
        run: npm run test:db

      - name: Build
        run: npx next build
