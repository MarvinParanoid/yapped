name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yapped
          POSTGRES_PASSWORD: yapped
          POSTGRES_DB: yapped_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yapped"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://yapped:yapped@localhost:5432/yapped_test?schema=public
      DATABASE_URL: postgresql://yapped:yapped@localhost:5432/yapped_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Service tests
        run: npm run test:db

      - name: Build
        run: npx next build

  # Images are published only from a green `check`, and only from the default
  # branch — so whatever is tagged `latest` has passed typecheck, both test
  # layers and a production build.
  #
  # Two images: the server that runs, and the tools that migrate. The VPS has
  # under 1 GB of RAM and one core, so building there is the single heaviest
  # thing that used to happen on it. Now it only pulls.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - target: runner
            image: yapped
          - target: tools
            image: yapped-tools

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` is what a deploy pulls; the sha tag is what a rollback pins.
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
