name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yapped
          POSTGRES_PASSWORD: yapped
          POSTGRES_DB: yapped_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yapped"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://yapped:yapped@localhost:5432/yapped_test?schema=public
      DATABASE_URL: postgresql://yapped:yapped@localhost:5432/yapped_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Service tests
        run: npm run test:db

      - name: Build
        run: npx next build

  # Images are published only from a green `check`, and only from the default
  # branch — so whatever is tagged `latest` has passed typecheck, both test
  # layers and a production build.
  #
  # Two images: the server that runs, and the tools that migrate. The VPS has
  # under 1 GB of RAM and one core, so building there is the single heaviest
  # thing that used to happen on it. Now it only pulls.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - target: runner
            image: yapped
          - target: tools
            image: yapped-tools

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest` is what a deploy pulls; the sha tag is what a rollback pins.
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # The last hop: tell the server to roll out the images that were just
  # published. It runs only after `publish`, so the tag it deploys exists.
  #
  # The key in DEPLOY_KEY is pinned to one command in the server's
  # authorized_keys — it opens no shell, forwards nothing, and takes no
  # arguments. Its whole power is "redeploy whatever is on origin/main", which
  # is what a push already decided. The host key is pinned too, so a hijacked
  # DNS record cannot collect the secret.
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One rollout at a time, and never cancelled halfway: the script restarts
    # containers, and an interrupted run would leave the checkout ahead of the
    # image it is serving.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Roll out
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # No command is passed: the server decides what this key may run.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST"
